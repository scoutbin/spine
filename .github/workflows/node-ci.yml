name: Node CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In a reusable workflow, files resolve to the caller. job.workflow_* points
      # at spine at the commit the caller pinned, so spine owns the Node and pnpm
      # versions and the Prettier install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .spine
          sparse-checkout: |
            .node-version
            package.json
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: .spine
          require-lockfile: true
      # pnpm/setup only accepts a working-directory inside the workspace, so
      # Prettier is told to skip spine's own files instead.
      - run: .spine/node_modules/.bin/prettier --check . '!.spine'
